<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Templo Cuántico – App Viva</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family: Georgia, serif;
    color:white;
}

/* 🌌 COSMOS */
canvas{
    position:fixed;
    top:0;
    left:0;
}

/* 🧘 UI */
#ui{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
    box-sizing:border-box;
}

#titulo{
    font-size:34px;
    color:#ffd27a;
    text-shadow:0 0 20px rgba(255,200,120,0.4);
}

#texto{
    max-width:700px;
    margin-top:20px;
    opacity:0.85;
}

#resp{
    margin-top:20px;
    color:#7fd3ff;
    font-size:20px;
}

#btn{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    padding:12px 20px;
    background:#111;
    border:1px solid #444;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="ui">
    <div id="titulo">Templo Cuántico</div>
    <div id="texto">Toca para entrar al espacio sagrado</div>
    <div id="resp">—</div>
</div>

<button id="btn" onclick="iniciar()">▶ Entrar al templo</button>

<script>

/* =========================
   🌌 COSMOS
========================= */

const c = document.getElementById("c");
const ctx = c.getContext("2d");

c.width = innerWidth;
c.height = innerHeight;

window.onresize = () => {
    c.width = innerWidth;
    c.height = innerHeight;
};

let particulas = [];

for(let i=0;i<180;i++){
    particulas.push({
        x:Math.random()*c.width,
        y:Math.random()*c.height,
        vx:(Math.random()-0.5)*0.4,
        vy:(Math.random()-0.5)*0.4,
        r:Math.random()*2
    });
}

function animar(){
    ctx.fillStyle="rgba(0,0,0,0.25)";
    ctx.fillRect(0,0,c.width,c.height);

    for(let p of particulas){
        p.x += p.vx;
        p.y += p.vy;

        if(p.x<0||p.x>c.width) p.vx*=-1;
        if(p.y<0||p.y>c.height) p.vy*=-1;

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle="rgba(150,220,255,0.8)";
        ctx.shadowBlur=12;
        ctx.shadowColor="#7fd3ff";
        ctx.fill();
    }

    requestAnimationFrame(animar);
}

animar();

/* =========================
   🧠 VOZ MAESTRO INTERNO
========================= */

function hablar(texto){
    const msg = new SpeechSynthesisUtterance(texto);
    msg.lang = "es-ES";
    msg.rate = 0.9;
    msg.pitch = 0.75;
    msg.volume = 1;
    speechSynthesis.speak(msg);
}

/* =========================
   🧘 CEREMONIA
========================= */

let fases = [
{
    nombre:"Entrada",
    texto:"Respira. El templo te reconoce.",
    voz:"Respira. El templo te reconoce. Estás entrando al presente.",
    resp:"Inhala 4 / Exhala 6",
    dur:12
},
{
    nombre:"Vacío",
    texto:"Todo surge desde el silencio.",
    voz:"Todo surge desde el silencio. No hay nada que buscar.",
    resp:"Inhala 3 / Exhala 5",
    dur:14
},
{
    nombre:"Vibración",
    texto:"Eres onda, no objeto.",
    voz:"Eres vibración. No eres forma fija. Eres movimiento.",
    resp:"Inhala 3 / Exhala 5",
    dur:14
},
{
    nombre:"Espejo",
    texto:"No estás separado de nada.",
    voz:"No estás separado de nada. Todo es reflejo de lo mismo.",
    resp:"Respiración alterna",
    dur:14
},
{
    nombre:"Acción",
    texto:"Haz sin controlar el resultado.",
    voz:"Actúa sin miedo al resultado. Confía en el proceso.",
    resp:"Inhala acción / Exhala entrega",
    dur:16
},
{
    nombre:"Liberación",
    texto:"Suéltalo todo.",
    voz:"Suéltalo todo. Incluso la idea de ti mismo.",
    resp:"Respiración libre",
    dur:16
}
];

let i=0;
let t=0;
let loop;

function iniciar(){
    document.getElementById("btn").style.display="none";
    document.documentElement.requestFullscreen?.();
    siguiente();
}

function siguiente(){

    if(i >= fases.length){
        document.getElementById("titulo").innerText = "Silencio";
        document.getElementById("texto").innerText = "El templo ahora respira contigo.";
        document.getElementById("resp").innerText = "...";
        hablar("La ceremonia ha terminado. Permanece en silencio. El templo ahora eres tú.");
        return;
    }

    let f = fases[i];

    document.getElementById("titulo").innerText = f.nombre;
    document.getElementById("texto").innerText = f.texto;
    document.getElementById("resp").innerText = f.resp;

    hablar(f.voz);

    t = 0;
    clearInterval(loop);

    loop = setInterval(() => {
        t++;
        if(t >= f.dur){
            i++;
            siguiente();
        }
    }, 1000);
}

</script>

</body>
</html>
